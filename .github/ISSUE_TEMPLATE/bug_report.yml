name: Bug report
description: Something in Poseit doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per report, please. Some things are known not to work yet: see
        [known limitations](https://github.com/mdhaarishussain/Poseit#status-and-known-limitations).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw. Include the exact text of any message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, from opening the app.
      placeholder: |
        1. Open the pose camera with "Hand on hip"
        2. Switch to the front camera
        3. Step into the frame
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: screen
    attributes:
      label: Where it happened
      options:
        - Library
        - Pose detail
        - Pose camera
        - Pose editor
        - Pose from a photo
        - Your photos
        - Settings
        - Onboarding
        - Somewhere else
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone model
      placeholder: Pixel 7a
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      placeholder: "14"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Poseit version
      description: In Poseit, open Settings and scroll down to About.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or a screen recording
      description: Drag files here. They help a lot with camera and overlay problems.
