name: Feature request
description: Suggest something new for the app, other than a pose.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation, and where Poseit gets in the way or falls short.
      placeholder: When I shoot a group with the self-timer, I can't tell who is out of position.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: Your idea for how it could work. A sketch or mock-up is welcome.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Other apps that do this well, workarounds you use now, or why it matters to you.
