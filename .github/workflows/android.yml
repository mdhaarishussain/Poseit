name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache MediaPipe models
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/models
          key: mediapipe-models-v1

      - name: Unit tests (pose engine)
        run: ./gradlew :pose-core:test --console=plain

      - name: App tests (Robolectric UI flows + screenshots)
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build debug + release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --console=plain

      - name: Check 16 KB page alignment of native libraries
        run: |
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | sort -V | tail -1)
          "$ZIPALIGN" -c -P 16 -v 4 app/build/outputs/apk/release/app-release.apk | tail -5

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: poseit-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
